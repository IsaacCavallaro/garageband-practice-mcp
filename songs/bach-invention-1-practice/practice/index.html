<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bach Invention 1 Practice Practice</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #5f6368;
      --line: #d8dce3;
      --paper: #fbfbf8;
      --panel: #ffffff;
      --accent: #1f7a5c;
      --accent-strong: #155b44;
      --warm: #b45f06;
      --shadow: 0 10px 30px rgba(32, 33, 36, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    h1 {
      font-size: 19px;
      line-height: 1.2;
      margin: 0;
      font-weight: 720;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button, .file-link {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 7px;
      min-height: 36px;
      padding: 0 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.primary:hover { background: var(--accent-strong); }
    button:hover, .file-link:hover { border-color: var(--accent); }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 310px;
      gap: 0;
      min-height: 0;
    }

    .score {
      min-height: 0;
      border-right: 1px solid var(--line);
      background: #e9ecef;
    }

    .score iframe {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 73px);
      border: 0;
      background: #fff;
    }

    .empty-score {
      height: 100%;
      min-height: calc(100vh - 73px);
      display: grid;
      place-items: center;
      color: var(--muted);
      padding: 24px;
      text-align: center;
    }

    aside {
      background: var(--panel);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .metric strong {
      display: block;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .progress {
      height: 11px;
      border-radius: 999px;
      background: #e6e8eb;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .progress div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--warm));
    }

    .now {
      display: grid;
      gap: 5px;
    }

    .now strong {
      font-size: 24px;
      line-height: 1;
      letter-spacing: 0;
    }

    .now span {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .files {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .note-lane {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      display: grid;
      gap: 8px;
      max-height: 240px;
      overflow: auto;
    }

    .note-row {
      display: grid;
      grid-template-columns: 48px 1fr 56px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    .note-row.active {
      color: var(--accent-strong);
      font-weight: 750;
    }

    @media (max-width: 900px) {
      header {
        grid-template-columns: 1fr;
      }

      .transport {
        justify-content: flex-start;
      }

      main {
        grid-template-columns: 1fr;
      }

      .score {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        height: 68vh;
      }

      .score iframe,
      .empty-score {
        min-height: 68vh;
      }
    }
  </style>
</head>

      currentNote.textContent = active ? active.name + " | " + active.track : "Ready";
      for (const row of noteLane.querySelectorAll(".note-row")) {
        row.classList.toggle("active", Number(row.dataset.index) === active?.index);
      }
    }

    function findActiveNote(position) {
      let best = null;
      for (let index = 0; index < notes.length; index += 1) {
        const note = notes[index];
        if (note.time <= position && note.time + Math.max(0.08, note.duration) >= position) {
          best = { ...note, index };
          break;
        }
        if (note.time > position) break;
      }
      return best;
    }

    function renderNoteLane() {
      const sample = notes.filter((_, index) => index % Math.max(1, Math.floor(notes.length / 80)) === 0).slice(0, 80);
      noteLane.innerHTML = sample.map((note) => {
        const index = notes.indexOf(note);
        return '<div class="note-row" data-index="' + index + '"><strong>' + note.name + '</strong><span>' + escapeText(note.track) + '</span><span>M' + note.measure + '</span></div>';
      }).join("");
    }

    function formatTime(seconds) {
      const whole = Math.max(0, Math.floor(seconds));
      return Math.floor(whole / 60) + ":" + String(whole % 60).padStart(2, "0");
    }

    function escapeText(text) {
      return String(text).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }
  </script>
</body>
</html>
